spring.application.name=chaekdami
spring.profiles.active=dev

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.show_sql=true
spring.flyway.enabled=true

spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

jwt.secret=${JWT_SECRET}

jwt.refresh-token-validity-in-seconds=7776000

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=2226061@a.ut.ac.kr
spring.mail.password=${MAIL_PASSWORD}
app.mail.from=chaekdami-mail-sender <2226061@a.ut.ac.kr>
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

app.public-base-url=http://localhost:8080
