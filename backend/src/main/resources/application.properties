spring.application.name=chaekdami
spring.profiles.active=dev

yes24.base-url=https://apis.yes24.com
yes24.api-key=${YES24_API_KEY:}
spring.datasource.driver-class-name=org.postgresql.Driver

# 테이블은 JPA 엔티티로 생성한다.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.show_sql=true

jwt.secret=${JWT_SECRET}

jwt.refresh-token-validity-in-seconds=7776000

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=2226061@a.ut.ac.kr
spring.mail.password=${MAIL_PASSWORD}
app.mail.from=chaekdami-mail-sender <2226061@a.ut.ac.kr>
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

app.public-base-url=http://localhost:8080

# 독서 인증 사진 업로드 (기본 1MB → 10MB)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# 독서 인증 AI: 환경변수 OCR_PROVIDER=gemini + GEMINI_API_KEY 를 넣으면 Gemini 사용, 없으면 가짜 추출기(mock)
reading.ocr.provider=${OCR_PROVIDER:mock}
reading.ocr.gemini.api-key=${GEMINI_API_KEY:}
reading.ocr.gemini.model=${GEMINI_MODEL:gemini-3.8-flash}

# Supabase Session pooler는 전체 연결이 15개로 제한됨 → 서버 하나당 연결을 적게 사용 (팀원 여러 명이 동시에 서버를 띄우기 때문)
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
