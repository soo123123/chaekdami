spring.application.name=chaekdami
spring.profiles.active=dev

# 테이블은 Flyway가 만든다. Hibernate는 엔티티와 맞는지 확인만 한다.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

# Base64로 인코딩한 32바이트 이상 키. 값이 없으면 서버가 시작하지 않는다.
jwt.secret=${JWT_SECRET}
# Refresh Token 90일. Access Token 유효 시간은 코드에서 15분으로 고정한다.
jwt.refresh-token-validity-in-seconds=7776000
